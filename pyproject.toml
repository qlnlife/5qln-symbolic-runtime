[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qln-symbolic-runtime"
version = "1.0.0"
description = "5QLN Constitutional Codex as operational Python runtime — every symbol, phase, and validation rule executes as code"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [{name = "qlnlife", email = "amihai@qln.life"}]
keywords = ["5qln", "codex", "constitutional-language", "symbolic-runtime", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://www.5qln.com/codex"
Repository = "https://github.com/qlnlife/5qln-symbolic-runtime"
Documentation = "https://www.5qln.com/codex"

[tool.setuptools]
packages = ["qln_symbolic_runtime"]
